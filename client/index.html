<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafcfb" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='58' r='38' fill='%23fafcfb' stroke='%2334C38F' stroke-width='6'/><path d='M38 22q0-14 13-14t13 11q0 7-8 10t-5 10' fill='none' stroke='%2334C38F' stroke-width='6' stroke-linecap='round'/><circle cx='38' cy='58' r='5' fill='%231F3A2E'/><circle cx='62' cy='58' r='5' fill='%231F3A2E'/></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>배배에게 알려줘 · mentee</title>
    <script>
      // 첫 화면이 깜빡이지 않도록, 저장된 테마(또는 시스템 설정)를 렌더 전에 적용
      (function () {
        var t = null;
        try { t = localStorage.getItem('mentee-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        else document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0d1611' : '#fafcfb');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
